<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Billing</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">

<!-- iOS icon -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="header">Hotel Billing</div>

<div class="container">

    <div class="card">
        <div class="input-row">
            <div class="label">Giá giờ đầu</div>
            <input type="number" id="priceFirst" value="70000">
        </div>

        <div class="input-row">
            <div class="label">Giá giờ tiếp theo</div>
            <input type="number" id="priceExtra" value="10000">
        </div>

        <div class="input-row">
            <div class="label">Giờ vào</div>
            <input type="time" id="timeIn">
        </div>

        <div class="input-row">
            <div class="label">Giờ ra</div>
            <input type="time" id="timeOut">
        </div>

        <div class="input-row">
            <div class="label">Số lượng nước (10.000 đ/chai)</div>
            <input type="number" id="waterQty" value="0" min="0" step="1">
        </div>

        <div class="action-row">
            <button id="checkInBtn" class="btn btn-secondary" type="button">Checkin</button>
            <button id="checkOutBtn" class="btn btn-secondary" type="button">Checkout</button>
        </div>

        <button id="calculateBtn" class="btn" type="button">Tính tiền</button>
    </div>

    <div id="result" class="card result">
        <div class="result-row">
            <span>Thời gian</span>
            <span id="resHours"></span>
        </div>
        <div class="result-row">
            <span>Tiền phòng</span>
            <span id="resRoom"></span>
        </div>
        <div class="result-row">
            <span>Tiền nước</span>
            <span id="resWater"></span>
        </div>
        <div class="result-row total">
            <span>Tổng</span>
            <span id="resTotal"></span>
        </div>
    </div>

    <div class="card">
        <div class="history-head">
            <div class="history-title">Lịch sử</div>
            <button id="clearHistoryBtn" class="history-clear-btn" type="button">Xóa toàn bộ</button>
        </div>
        <div id="historyList" class="history-empty">Chưa có lượt tính tiền nào.</div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>

</body>
</html>
